name: Verify application and evidence boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sophie_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sophie_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/sophie_test_ci
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/sophie_test_ci
      DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/sophie_test_ci
      GEMINI_PROCESSING_APPROVED: 'false'
      GEMINI_APPROVED_FOR_PUBLIC_USE: 'false'
      GEMINI_PAID_SERVICE_CONFIRMED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:http
      - run: npm audit --audit-level=low
